service: my-serverless-api

plugins:
  - serverless-offline

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:Scan
        - dynamodb:GetItem
      Resource: "*"

functions:
  hello:
    handler: src/handlers/hello.handler
    events:
      - http:
          path: /hello
          method: get
  createCustomer:
    handler: src/handlers/createCustomer.handler
    events:
      - http:
          path: /clients
          method: post
  listCustomers:
    handler: src/handlers/listCustomers.handler
    events:
      - http:
          path: /clients
          method: get
  getCustomer:
    handler: src/handlers/getCustomer.handler
    events:
      - http:
          path: /clients/{id}
          method: get

resources:
  Resources:
    ClientesFidelidadeTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ClientsFidelity
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST