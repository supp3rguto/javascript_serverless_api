service: my-serverless-api

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:PutItem
      Resource: "*"

plugins:
  - serverless-offline

functions:
  hello:
    handler: src/handlers/hello.handler
    events:
      - http:
          path: /hello
          method: get

  createCustomer:
    handler: src/handlers/createCustomer.handler
    events:
      - http:
          path: /clientes
          method: post